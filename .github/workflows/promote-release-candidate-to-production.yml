name: Promote Release Candidate to Production

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Release-candidate tag to promote
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  promote:
    uses: synapptech-devops/pipelines/.github/workflows/promote-release-candidate-to-production.yml@v2
    with:
      pipeline_ref: v2
      rc_tag: ${{ inputs.rc_tag }}
    secrets:
      PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
