name: Release — Generate environment manifest

on:
  workflow_run:
    workflows:
      - Generate Release Candidate Artifacts
      - Release — Create a candidate manually
      - Promote Release Candidate to Production
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    uses: synapptech-devops/pipelines/.github/workflows/generate-environment-manifest.yml@v2
    with:
      pipeline_ref: v2
    secrets:
      PIPELINE_TOKEN: ${{ secrets.PIPELINE_TOKEN }}
